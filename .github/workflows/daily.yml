# The 6am refresh, run free by GitHub Actions against the same database the website uses.
# Needs repository secrets: DATABASE_URL (required); RESO_BASE_URL, RESO_TOKEN_URL, RESO_CLIENT_ID,
# RESO_CLIENT_SECRET, BATCHDATA_API_KEY, SOCRATA_APP_TOKEN (optional).
name: Daily refresh
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 6am New York in summer, 5am in winter
  workflow_dispatch:        # "Run workflow" button for a manual refresh
    inputs:
      pull_listings:
        description: "Pull new listings (uses 1 RentCast request)"
        type: boolean
        default: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Settings > Secrets and variables > Actions)"; exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m offmarket run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKIP_LISTINGS: ${{ github.event_name == 'workflow_dispatch' && !inputs.pull_listings && '1' || '0' }}
          RESO_BASE_URL: ${{ secrets.RESO_BASE_URL }}
          RESO_TOKEN_URL: ${{ secrets.RESO_TOKEN_URL }}
          RESO_CLIENT_ID: ${{ secrets.RESO_CLIENT_ID }}
          RESO_CLIENT_SECRET: ${{ secrets.RESO_CLIENT_SECRET }}
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          DIGEST_TO: Kai@conquest.nyc
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BATCHDATA_API_KEY: ${{ secrets.BATCHDATA_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
