# One-off lead re-check (relists, sales, owner records). Runs on pushes to this branch only.
name: Recheck leads
on:
  push:
    branches: [claude/project-thread-8v2ui0]
    paths: [recheck/ids.txt, scripts/recheck_leads.py, .github/workflows/recheck.yml]
permissions:
  contents: write
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/recheck_leads.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - name: Save results to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recheck/out.json
          git commit -m "Recheck results" && git push
