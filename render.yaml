# Free hosting: Render free web service (the website) + Neon free Postgres (the database)
# + GitHub Actions (the 6am refresh, see .github/workflows/daily.yml).
# The free web service sleeps after ~15 minutes idle; the first visit after that takes ~1 minute.
services:
  - type: web
    name: off-market-leads
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL          # Neon connection string (postgresql://...)
        sync: false
      - key: ENABLE_SCHEDULER      # the daily run happens in GitHub Actions, not here
        value: "0"
      - key: DASHBOARD_USER
        value: broker
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: RENTCAST_API_KEY
        sync: false
      - key: BATCHDATA_API_KEY
        sync: false
